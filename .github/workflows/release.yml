name: Release

# Tag push (v1.2.3) -> build, test, publish single-file exe, SHA-256 checksum, GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/PresenceSync.App -c Release -o publish -p:Version=$version

      # The exe is intentionally not code-signed (see SECURITY.md, known limitations); integrity via SHA-256 checksum.

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/PresenceSync.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PresenceSync.exe" | Set-Content publish/PresenceSync.exe.sha256 -Encoding ascii

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            publish/PresenceSync.exe
            publish/PresenceSync.exe.sha256
          generate_release_notes: true
